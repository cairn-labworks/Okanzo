<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Okanzo — marketing posters</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body { background:#050908; font-family:'Segoe UI', Roboto, system-ui, sans-serif; font-variant-numeric: tabular-nums; }

  .poster {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    background:
      radial-gradient(125% 56% at 50% -6%, #204938 0%, #142f24 28%, #0c1c16 54%, #08120e 76%, #050908 100%);
    color:#E8F0E9;
  }
  /* faint precision grid band near top */
  .poster::before{
    content:""; position:absolute; inset:0 0 auto 0; height:560px;
    background-image:
      linear-gradient(rgba(193,225,189,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(193,225,189,.055) 1px, transparent 1px);
    background-size:46px 46px; background-position:center top;
    -webkit-mask-image: radial-gradient(100% 100% at 50% 0%, #000 0%, transparent 70%);
            mask-image: radial-gradient(100% 100% at 50% 0%, #000 0%, transparent 70%);
    opacity:.65;
  }
  /* dotted texture full */
  .poster::after{
    content:""; position:absolute; inset:0;
    background-image: radial-gradient(rgba(193,225,189,.05) 1.4px, transparent 1.6px);
    background-size:30px 30px; opacity:.35; pointer-events:none;
  }
  .content{ position:relative; z-index:3; height:100%; display:flex; flex-direction:column; align-items:center; padding:92px 84px 72px; }

  .badge{
    display:inline-flex; align-items:center; gap:14px;
    border:1.5px solid rgba(193,225,189,.28); border-radius:100px;
    padding:15px 32px; font-size:25px; font-weight:800; letter-spacing:4px;
    color:#D6EBD1; text-transform:uppercase; background:rgba(193,225,189,.06);
  }
  .badge svg{ width:28px; height:28px; color:#C1E1BD; }
  .badge .bt{ background:linear-gradient(90deg,#E2F3DE,#9AC9A0); -webkit-background-clip:text; background-clip:text; color:transparent; }

  h1{ text-align:center; font-weight:900; font-size:102px; line-height:.98; letter-spacing:-2.6px; margin-top:40px; color:#F2F7F3; }
  h1 .accent{ color:#C1E1BD; background:linear-gradient(92deg,#8CC399,#C1E1BD 52%,#8CD5C8); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub{ text-align:center; font-size:33px; line-height:1.42; color:#9AB0A5; margin-top:30px; max-width:840px; font-weight:500; }
  .sub b{ color:#E8F0E9; font-weight:700; }

  .stage{ position:relative; flex:1; width:100%; margin-top:26px; display:flex; align-items:flex-end; justify-content:center; }

  /* ---- device ---- */
  .phone{
    width:568px; height:1168px; border-radius:66px; padding:14px;
    background:linear-gradient(#24332d,#0d1512);
    box-shadow: 0 60px 120px -30px rgba(0,0,0,.82), 0 0 0 2px rgba(193,225,189,.09) inset;
    position:relative;
  }
  .phone .screen{ width:100%; height:100%; border-radius:52px; overflow:hidden; position:relative; background:var(--surface); color:var(--text); }
  .phone .island{ position:absolute; top:18px; left:50%; transform:translateX(-50%); width:126px; height:32px; border-radius:20px; background:#090e0c; z-index:30; }
  .tilt{ transform: perspective(2600px) rotateY(-16deg) rotateX(4deg) rotateZ(1.5deg); transform-origin:center bottom; box-shadow:0 70px 130px -30px rgba(0,0,0,.85); }
  .tilt-r{ transform: perspective(2600px) rotateY(15deg) rotateX(4deg) rotateZ(-1.5deg); box-shadow:0 70px 130px -30px rgba(0,0,0,.85); }

  /* ---- Midnight Precision tokens (lib/ui/theme/colors.dart & app_style.dart) ---- */
  :root{
    --surface:#172220;
    --surface-lowest:#111B18;
    --surface-low:#20302A;
    --surface-mid:#24352E;
    --surface-high:#2B3D34;
    --sec-container:#24372E;
    --on-sec-container:#D3E3D4;
    --primary:#C1E1BD;
    --on-primary:#1E3025;
    --text:#E8F0E9;
    --muted:#88A196;
    --outline:#779184;
    --line:#2A3934;
    --neg:#FFB4AB;
    --cat-stock:#B9D6B4;
    --cat-gold:#C2B5D5;
    --cat-cash:#A7CFCC;
  }

  .sc{ position:absolute; inset:0; padding:54px 32px 0; display:flex; flex-direction:column; background:var(--surface); }
  .stat{ display:flex; align-items:center; justify-content:space-between; font-size:19px; font-weight:600; color:var(--text); padding:2px 4px 12px; opacity:.88; }
  .stat .r{ display:flex; gap:8px; align-items:center; }
  .stat svg{ width:21px; height:21px; }

  /* AppBar */
  .top{ display:flex; align-items:center; gap:6px; padding:4px 0 16px; min-height:64px; }
  .top .h{ font-size:25px; font-weight:600; color:var(--text); display:inline-flex; align-items:center; gap:6px; letter-spacing:-.2px; }
  .top .h svg{ width:22px; height:22px; color:var(--text); }
  .top .h-lg{ font-size:31px; font-weight:600; color:var(--text); letter-spacing:-.6px; }
  .top .spacer{ flex:1; }
  .top .ic{ width:46px; height:46px; border-radius:50%; display:grid; place-items:center; color:var(--muted); }
  .top .ic svg{ width:25px; height:25px; }
  .top .brand-tag{ font-size:15px; font-weight:600; letter-spacing:1.8px; color:var(--muted); padding-right:4px; }

  /* Unboxed Quiet Overview (NetWorthCard) */
  .nw-wrap{ padding:4px 0 2px; }
  .nw-lbl{ font-size:18px; font-weight:400; color:var(--muted); }
  .nw-val{ font-size:60px; font-weight:500; line-height:1.1; letter-spacing:-2.3px; color:var(--primary); margin-top:10px; }
  .nw-base{ font-size:18px; font-weight:400; color:var(--muted); margin-top:6px; }
  .nw-metrics{ display:flex; gap:20px; margin-top:18px; }
  .nw-m{ flex:1; padding:2px 0; }
  .nw-ml{ display:flex; align-items:center; gap:8px; font-size:18px; font-weight:500; color:var(--muted); }
  .nw-ml svg{ width:20px; height:20px; }
  .nw-mv{ font-size:24px; font-weight:500; color:var(--text); margin-top:6px; letter-spacing:-.2px; }

  /* Segmented HoldingSectionTabs */
  .tabs{ display:flex; background:var(--surface-low); border-radius:32px; padding:6px; margin:20px 0 16px; }
  .tabs .tab{ flex:1; height:54px; border-radius:24px; display:grid; place-items:center; font-size:19px; font-weight:500; color:var(--muted); }
  .tabs .tab.on{ background:var(--surface-high); color:var(--text); }

  /* Quiet CategoryPanel */
  .panel{ background:var(--surface-low); border-radius:28px; padding:0 22px; overflow:hidden; }
  .cat-row{ display:flex; align-items:center; gap:16px; padding:18px 0; }
  .cat-div{ height:1px; background:var(--line); }
  .avatar{ width:44px; height:44px; border-radius:14px; display:grid; place-items:center; background:color-mix(in srgb, var(--ac) 12%, transparent); color:var(--ac); flex-shrink:0; }
  .avatar svg{ width:24px; height:24px; }
  .cat-b{ flex:1; min-width:0; }
  .cat-n{ font-size:21px; font-weight:500; color:var(--text); }
  .cat-meta{ font-size:17px; color:var(--muted); margin-top:3px; }
  .cat-val{ font-size:21px; font-weight:500; color:var(--ac); text-align:right; }
  .cat-chev{ color:var(--muted); display:grid; place-items:center; margin-left:4px; }
  .cat-chev svg{ width:22px; height:22px; }

  .hold-list{ padding:4px 0 6px; }
  .hold-row{ display:flex; align-items:center; padding:12px 0 12px 12px; gap:10px; }
  .hold-b{ flex:1; min-width:0; }
  .hold-n{ font-size:22px; font-weight:400; color:var(--text); }
  .hold-m{ font-size:18px; color:var(--muted); margin-top:3px; }
  .hold-v{ font-size:20px; font-weight:400; color:var(--text); text-align:right; }
  .hold-drag{ color:var(--outline); display:grid; place-items:center; width:24px; }
  .hold-drag svg{ width:22px; height:22px; }

  /* Midnight sage FAB */
  .fab{ position:absolute; right:32px; bottom:122px; height:72px; padding:0 28px; border-radius:22px; display:flex; align-items:center; gap:12px;
    background:linear-gradient(135deg,#C1E1BD,#B2D0AE); color:var(--on-primary); font-size:22px; font-weight:600;
    box-shadow:0 12px 24px -8px rgba(0,0,0,.45); z-index:10; }
  .fab svg{ width:26px; height:26px; }

  /* Material 3 Bottom NavigationBar */
  .nav{ position:absolute; left:0; right:0; bottom:0; height:98px; display:flex; align-items:center; justify-content:space-around;
    background:var(--surface); border-top:1px solid var(--line); z-index:12; padding-bottom:6px; }
  .nav .ni{ display:flex; flex-direction:column; align-items:center; gap:6px; font-size:17px; font-weight:500; color:var(--muted); }
  .nav .ni .p{ width:82px; height:42px; border-radius:21px; display:grid; place-items:center; }
  .nav .ni svg{ width:26px; height:26px; }
  .nav .ni.on{ color:var(--text); font-weight:600; }
  .nav .ni.on .p{ background:var(--sec-container); color:var(--on-sec-container); }

  /* Statistics _ChartCard */
  .chart-card{ background:var(--surface-low); border-radius:28px; padding:24px 26px; margin-bottom:18px; }
  .chart-t{ font-size:22px; font-weight:600; color:var(--text); }
  .chart-sub{ font-size:17px; color:var(--muted); margin-top:3px; }
  .donut-wrap{ width:236px; height:236px; margin:16px auto 14px; position:relative; display:grid; place-items:center; }
  .donut-wrap svg{ width:236px; height:236px; overflow:visible; }
  .donut-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 36px; }
  .donut-cl{ font-size:16px; font-weight:500; color:var(--muted); }
  .donut-cv{ font-size:26px; font-weight:600; color:var(--text); margin-top:3px; letter-spacing:-.5px; }
  .legend{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .legend .li{ display:flex; align-items:center; gap:14px; font-size:19px; color:var(--text); padding:4px 2px; }
  .legend .dot{ width:15px; height:15px; border-radius:50%; flex-shrink:0; }
  .legend .lv{ margin-left:auto; color:var(--text); }

  /* LockScreen */
  .lock{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 28px 56px; text-align:center; }
  .lock-box{ width:132px; height:132px; border-radius:38px; background:var(--surface-low); display:grid; place-items:center; color:var(--primary); }
  .lock-box svg{ width:60px; height:60px; }
  .lock-title{ font-size:34px; font-weight:600; color:var(--text); margin-top:34px; letter-spacing:-.6px; }
  .lock-sub{ font-size:21px; line-height:1.45; color:var(--muted); margin-top:14px; max-width:410px; }
  .lock-btn{ margin-top:44px; height:68px; padding:0 36px; border-radius:22px; background:var(--primary); color:var(--on-primary);
    display:inline-flex; align-items:center; gap:14px; font-size:22px; font-weight:600; }
  .lock-btn svg{ width:28px; height:28px; }

  /* Portfolios _PortfolioCard */
  .pcard{ background:var(--surface-low); border-radius:28px; padding:26px 26px 24px; margin-bottom:16px; }
  .pcard .pt{ display:flex; align-items:center; gap:12px; }
  .pcard .pn{ font-size:23px; font-weight:600; color:var(--text); flex:1; }
  .pcard .pbadge{ font-size:15px; font-weight:600; color:var(--primary); background:rgba(193,225,189,.11); border-radius:11px; padding:6px 13px; }
  .pcard .more{ color:var(--muted); display:grid; place-items:center; width:32px; height:32px; }
  .pcard .more svg{ width:24px; height:24px; }
  .pcard .pv{ font-size:38px; font-weight:600; letter-spacing:-1px; color:var(--primary); margin-top:20px; }
  .pcard .pmeta{ font-size:19px; color:var(--muted); margin-top:6px; }

  /* Settings -> Data + _ExportDialog */
  .page-h{ font-size:42px; font-weight:600; letter-spacing:-1.2px; color:var(--text); margin:6px 0 28px; }
  .set-row{ display:flex; align-items:center; gap:14px; padding:22px 0; border-bottom:1px solid var(--line); }
  .set-b{ flex:1; }
  .set-t{ font-size:21px; color:var(--text); }
  .set-s{ font-size:17px; color:var(--muted); margin-top:4px; }
  .scrim{ position:absolute; inset:0; background:rgba(7,12,10,.58); z-index:16; display:flex; align-items:center; justify-content:center; padding:28px; }
  .dialog{ width:100%; background:var(--surface-low); border-radius:36px; padding:32px 30px 26px; box-shadow:0 32px 64px rgba(0,0,0,.55); border:1px solid rgba(193,225,189,.08); }
  .dlg-t{ font-size:30px; font-weight:600; color:var(--text); letter-spacing:-.4px; }
  .dlg-d{ font-size:18px; line-height:1.42; color:var(--muted); margin-top:12px; }
  .dlg-checks{ margin-top:18px; display:flex; flex-direction:column; gap:12px; }
  .dlg-chk{ display:flex; align-items:center; gap:16px; font-size:20px; color:var(--text); padding:4px 0; }
  .dlg-box{ width:26px; height:26px; border-radius:6px; background:var(--primary); color:var(--on-primary); display:grid; place-items:center; flex-shrink:0; }
  .dlg-box svg{ width:18px; height:18px; }
  .ufield{ margin-top:18px; padding-bottom:12px; border-bottom:1.5px solid var(--line); display:flex; align-items:flex-end; justify-content:space-between; }
  .ufield.focus{ border-bottom-color:var(--primary); }
  .ufield .ul{ font-size:15px; color:var(--muted); margin-bottom:6px; }
  .ufield .uv{ font-size:21px; letter-spacing:3px; color:var(--text); }
  .ufield .uic{ color:var(--muted); width:24px; height:24px; }
  .dlg-acts{ display:flex; justify-content:flex-end; gap:28px; margin-top:26px; padding-right:4px; }
  .dlg-act{ font-size:20px; font-weight:600; color:var(--primary); }
  .dlg-act.muted{ color:var(--muted); }

  /* ---- floating callouts ---- */
  .callout{ position:absolute; z-index:25; display:flex; align-items:center; gap:18px;
    background:rgba(17,27,24,.94); border:1px solid rgba(193,225,189,.18); border-radius:22px; padding:18px 24px;
    box-shadow:0 30px 60px -22px rgba(0,0,0,.85); backdrop-filter:blur(8px); }
  .callout .cc{ width:58px; height:58px; border-radius:16px; display:grid; place-items:center; flex-shrink:0; }
  .callout .cc svg{ width:30px; height:30px; }
  .callout .ct{ font-size:26px; font-weight:800; letter-spacing:-.4px; color:#F2F7F3; }
  .callout .cs{ font-size:17px; font-weight:700; letter-spacing:1.4px; color:#88A196; text-transform:uppercase; margin-top:3px; }

  /* ---- bottom ---- */
  .pills{ display:flex; gap:20px; justify-content:center; z-index:4; margin-top:26px; }
  .pills .pill{ border:1.5px solid rgba(193,225,189,.24); border-radius:100px; padding:16px 32px; font-size:24px; font-weight:800; letter-spacing:2px; color:#D6EBD1; background:rgba(193,225,189,.05); }
  .brand{ display:flex; align-items:center; gap:20px; z-index:4; margin-top:26px; }
  .brand .bl{ width:72px; height:72px; border-radius:20px; display:grid; place-items:center; background:linear-gradient(135deg,#1F6E50,#164E38); box-shadow:0 16px 30px -12px rgba(31,110,80,.65); }
  .brand .bl svg{ width:44px; height:44px; }
  .brand .bn{ font-size:42px; font-weight:900; letter-spacing:-.5px; color:#F2F7F3; }
  .brand .bt{ font-size:26px; font-weight:800; letter-spacing:3px; color:#88A196; }

  /* ---- Streak-style wide hero banner (1200x400 @ 2x -> 2400x800) ---- */
  .banner{
    width:1200px; height:400px; position:relative; overflow:hidden;
    background:
      radial-gradient(58% 130% at 75% 46%, #23543f 0%, #153428 36%, #0b1c15 66%, #060c0a 86%, #040807 100%);
    color:#E8F0E9;
  }
  .banner::before{
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(193,225,189,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(193,225,189,.04) 1px, transparent 1px);
    background-size:36px 36px;
    -webkit-mask-image: radial-gradient(65% 95% at 76% 40%, #000 0%, transparent 78%);
            mask-image: radial-gradient(65% 95% at 76% 40%, #000 0%, transparent 78%);
    pointer-events:none;
  }
  .banner::after{
    content:""; position:absolute; inset:0;
    background-image: radial-gradient(rgba(193,225,189,.055) 1px, transparent 1.2px);
    background-size:20px 20px; opacity:.45; pointer-events:none;
  }
  .b-left{
    position:absolute; left:68px; top:0; bottom:0; width:490px; z-index:10;
    display:flex; flex-direction:column; justify-content:center;
  }
  .b-brand{ display:flex; align-items:center; gap:18px; }
  .b-icon{
    width:64px; height:64px; border-radius:16px; display:grid; place-items:center;
    background:linear-gradient(135deg,#127355,#185624);
    box-shadow:0 14px 28px -10px rgba(18,115,85,.65), 0 0 0 1px rgba(193,225,189,.18) inset;
  }
  .b-icon svg{ width:42px; height:42px; }
  .b-title{ font-size:64px; font-weight:900; letter-spacing:-2.2px; line-height:1; color:#F4F8F5; }
  .b-sub{ margin-top:22px; font-size:21.5px; line-height:1.45; color:#B4C7BD; font-weight:400; }
  .b-pills{ display:flex; gap:12px; margin-top:28px; }
  .b-pill{
    border:1.25px solid rgba(193,225,189,.28); border-radius:100px;
    padding:9px 20px; font-size:12.5px; font-weight:700; letter-spacing:1.8px;
    color:#E4F1E7; background:rgba(19,33,28,.6);
  }
  .b-stage{ position:absolute; left:520px; right:0; top:0; bottom:0; z-index:5; }
  .b-phone-slot{ position:absolute; transform-origin:top left; }
  .b-phone-slot .phone{
    box-shadow: 0 36px 80px -16px rgba(0,0,0,.88), 0 0 0 2px rgba(193,225,189,.13) inset;
  }

  /* ---- Streak-style F-Droid / store featureGraphic (1024x500) ---- */
  .fgraphic{
    width:1024px; height:500px; position:relative; overflow:hidden;
    background:
      radial-gradient(80% 72% at 50% 8%, #21503c 0%, #143125 34%, #0b1b15 62%, #060b09 86%, #040807 100%);
    color:#E8F0E9; display:flex; flex-direction:column; align-items:center;
  }
  .fgraphic::after{
    content:""; position:absolute; inset:0;
    background-image: radial-gradient(rgba(193,225,189,.055) 1px, transparent 1.2px);
    background-size:20px 20px; opacity:.45; pointer-events:none;
  }
  .fg-top{ position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; padding-top:34px; }
  .fg-brand{ display:flex; align-items:center; gap:14px; }
  .fg-icon{
    width:46px; height:46px; border-radius:12px; display:grid; place-items:center;
    background:linear-gradient(135deg,#127355,#185624);
    box-shadow:0 10px 22px -8px rgba(18,115,85,.65), 0 0 0 1px rgba(193,225,189,.18) inset;
  }
  .fg-icon svg{ width:30px; height:30px; }
  .fg-title{ font-size:48px; font-weight:900; letter-spacing:-1.6px; line-height:1; color:#F4F8F5; }
  .fg-sub{ margin-top:14px; font-size:19px; color:#B4C7BD; font-weight:400; text-align:center; }
  .fg-pills{ display:flex; gap:10px; margin-top:16px; }
  .fg-pill{
    border:1.2px solid rgba(193,225,189,.28); border-radius:100px;
    padding:6px 16px; font-size:11px; font-weight:700; letter-spacing:1.6px;
    color:#E4F1E7; background:rgba(19,33,28,.62);
  }
  .fg-stage{ position:absolute; left:0; right:0; top:208px; bottom:0; z-index:5; }
  .fg-phone-slot{ position:absolute; transform-origin:top left; }
  .fg-phone-slot .phone{
    box-shadow: 0 32px 72px -14px rgba(0,0,0,.9), 0 0 0 2px rgba(193,225,189,.14) inset;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const I = {
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>',

function donutSVG(slices){
  const size = 236, outer = size / 2, stroke = outer * 0.42, r = outer - stroke / 2;
  const cx = size / 2, cy = size / 2, gap = 1.8;
  const total = slices.reduce((s, x) => s + x[1], 0);
  let start = -90;
  const paths = slices.map(([color, val]) => {
    const sweep = (val / total) * 360;
    const a1 = (start * Math.PI) / 180;
    const a2 = ((start + Math.max(1, sweep - gap)) * Math.PI) / 180;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    const large = sweep - gap > 180 ? 1 : 0;
    start += sweep;
    return `<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r.toFixed(2)} ${r.toFixed(2)} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" fill="none" stroke="${color}" stroke-width="${stroke.toFixed(2)}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}">${paths}</svg>`;
}

function posterHTML(p){
  const h = p.accentLine!==undefined
    ? p.h.map((line,i)=> i===p.accentLine ? `<span class="accent">${line}</span>` : line).join('<br>')
    : p.h.join('<br>');
  return `<div class="poster" data-file="${p.file}">
    <div class="content">
      <div class="badge">${I[p.badgeIcon]}<span class="bt">${p.badge}</span></div>
      <h1>${h}</h1>
      <div class="sub">${p.sub}</div>
      <div class="stage">
        ${p.callouts.map(calloutHTML).join('')}
        <div class="phone ${p.phoneClass}"><div class="island"></div><div class="screen">${p.screen()}</div></div>
      </div>
      ${bottomHTML(p.bottom)}
    </div>
  </div>`;
}

function bannerHTML(){
  return `<div class="banner">
    <div class="b-left">
      <div class="b-brand">
        <div class="b-icon">${I.trend}</div>
        <div class="b-title">Okanzo</div>
      </div>
      <div class="b-sub">A private, offline-first net worth tracker.<br>Encrypted on your phone, in any currency.</div>
      <div class="b-pills">
        <div class="b-pill">FREE</div>

        <div class="b-pill">NO ACCOUNT</div>

    </div>
    <div class="b-stage">

        <div class="phone"><div class="island"></div><div class="screen">${statsScreen()}</div></div>

      <div class="b-phone-slot" style="left:184px; top:28px; z-index:4; transform:scale(0.48);">
        <div class="phone"><div class="island"></div><div class="screen">${homeScreen(true)}</div></div>
      </div>
      <div class="b-phone-slot" style="left:418px; top:74px; z-index:3; transform:perspective(1500px) rotateY(-15deg) rotateX(3deg) rotateZ(4deg) scale(0.42);">
        <div class="phone"><div class="island"></div><div class="screen">${lockScreen()}</div></div>
      </div>
    </div>
  </div>`;
}

function featureGraphicHTML(){
  return `<div class="fgraphic">
    <div class="fg-top">
      <div class="fg-brand">
        <div class="fg-icon">${I.trend}</div>
        <div class="fg-title">Okanzo</div>
      </div>
      <div class="fg-sub">A private, offline-first net worth tracker</div>
      <div class="fg-pills">
        <div class="fg-pill">FREE</div>
        <div class="fg-pill">OPEN SOURCE</div>
        <div class="fg-pill">NO ACCOUNT</div>
      </div>
    </div>
    <div class="fg-stage">
      <div class="fg-phone-slot" style="left:212px; top:34px; z-index:2; transform:perspective(1400px) rotateY(15deg) rotateX(3deg) rotateZ(-6deg) scale(0.37);">
        <div class="phone"><div class="island"></div><div class="screen">${statsScreen()}</div></div>
      </div>
      <div class="fg-phone-slot" style="left:392px; top:4px; z-index:4; transform:scale(0.42);">
        <div class="phone"><div class="island"></div><div class="screen">${homeScreen(true)}</div></div>
      </div>
      <div class="fg-phone-slot" style="left:602px; top:32px; z-index:3; transform:perspective(1400px) rotateY(-15deg) rotateX(3deg) rotateZ(6deg) scale(0.37);">
        <div class="phone"><div class="island"></div><div class="screen">${lockScreen()}</div></div>
      </div>
    </div>
  </div>`;
}

document.getElementById('root').innerHTML = POSTERS.map(posterHTML).join('');

// Single-poster export mode: generate.html?p=INDEX renders just one 1080x1920 poster.
// Banner export mode: generate.html?banner=1 renders the 1200x400 (2400x800 @ 2x) README banner.
// Feature graphic mode: generate.html?feature=1 renders the 1024x500 F-Droid / store feature graphic.
const _params = new URLSearchParams(location.search);
const _single = _params.get('p');
const _banner = _params.get('banner');
const _feature = _params.get('feature');
if (_feature !== null) {
  document.documentElement.style.background = '#040807';
  document.body.style.width = '1024px';
  document.body.style.height = '500px';
  document.body.style.overflow = 'hidden';
  document.getElementById('root').innerHTML = featureGraphicHTML();
} else if (_banner !== null) {
  document.documentElement.style.background = '#040807';
  document.body.style.width = '1200px';
  document.body.style.height = '400px';
  document.body.style.overflow = 'hidden';
  document.getElementById('root').innerHTML = bannerHTML();
} else if (_single !== null) {
  const idx = parseInt(_single, 10);
  document.documentElement.style.background = '#050908';
  document.body.style.width = '1080px';
  document.body.style.height = '1920px';
  document.body.style.overflow = 'hidden';
  document.getElementById('root').innerHTML = posterHTML(POSTERS[idx]);
}
</script>
