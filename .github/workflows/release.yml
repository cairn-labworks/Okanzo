name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Match F-Droid's build environment and embedded Flutter/NDK paths.
    container: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie@sha256:1ea8bef1820bff06c2974e31b4fc4c79c364cd24231b86e71fa4b926797e0dac
    env:
      RELEASE_WORKSPACE: /home/vagrant/build/com.cairnlabworks.okanzo
      PUB_CACHE: /home/vagrant/build/com.cairnlabworks.okanzo/.pub-cache
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
    defaults:
      run:
        shell: bash
        working-directory: /home/vagrant/build/com.cairnlabworks.okanzo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare canonical build directory
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$RELEASE_WORKSPACE"
          cp -a . "$RELEASE_WORKSPACE/"
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache-path: /home/vagrant/build/srclib/flutter
          pub-cache-path: /home/vagrant/build/com.cairnlabworks.okanzo/.pub-cache
      - run: flutter config --android-sdk "$ANDROID_SDK_ROOT" --no-analytics
      - run: flutter pub get --enforce-lockfile

      # Writes the upload keystore and android/key.properties from repository secrets.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. See 'Release signing' in README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # Google Play bundle
      - run: flutter build appbundle --release
      # Per-ABI APKs for F-Droid and direct downloads
      - run: flutter build apk --release --split-per-abi --target-platform=android-arm
      - run: flutter build apk --release --split-per-abi --target-platform=android-arm64
      - run: flutter build apk --release --split-per-abi --target-platform=android-x64

      - uses: actions/upload-artifact@v4
        with:
          name: okanzo-${{ github.ref_name }}
          path: |
            /home/vagrant/build/com.cairnlabworks.okanzo/build/app/outputs/bundle/release/app-release.aab
            /home/vagrant/build/com.cairnlabworks.okanzo/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          # Signed builds are public in this repo's Actions tab; download promptly.
          retention-days: 1
