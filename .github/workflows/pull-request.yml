name: Pull request checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  quality:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run unit and widget tests
        run: flutter test --no-pub

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
            pubspec.lock
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Configure Gradle Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/maven-central-mirror.init.gradle.kts << 'EOF'
          val mavenCentralMirrorUrl = uri("https://maven-central.storage-download.googleapis.com/maven2/")

          beforeSettings {
              pluginManagement.repositories {
                  maven { url = mavenCentralMirrorUrl }
                  google()
                  gradlePluginPortal()
                  mavenCentral()
              }
              dependencyResolutionManagement.repositories {
                  maven { url = mavenCentralMirrorUrl }
                  google()
                  mavenCentral()
              }
          }

          projectsEvaluated {
              allprojects {
                  if (repositories.isNotEmpty()) {
                      val mirror = repositories.maven { url = mavenCentralMirrorUrl }
                      repositories.remove(mirror)
                      repositories.addFirst(mirror)
                  }
              }
          }
          EOF
      - name: Build debug APK without release signing secrets
        run: flutter build apk --debug --no-pub
